name: OpenWrt x86_64 Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 3'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Restore last built version cache
        id: cache-version
        uses: actions/cache/restore@v4
        with:
          path: last_build_version.txt
          key: last-build-version-
          restore-keys: |
            last-build-version-

      - name: Get latest OpenWrt stable release tag
        id: get_latest_tag
        run: |
          TAG=$(git ls-remote --tags --refs https://github.com/openwrt/openwrt.git \
            | awk -F/ '{print $NF}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n1)

          if [ -z "$TAG" ]; then
            echo "❌ Failed to fetch latest tag. Stop build."
            exit 1
          fi

          echo "Latest stable release: $TAG"
          echo "latest_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        env:
          EVENT_NAME: ${{ github.event_name }}
          LATEST_TAG: ${{ steps.get_latest_tag.outputs.latest_tag }}
        run: |
          if [ -f last_build_version.txt ]; then
            LAST_VER=$(cat last_build_version.txt)
          else
            LAST_VER="none"
          fi

          echo "Last built version: $LAST_VER"
          echo "Latest version: $LATEST_TAG"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "✅ Manual run: rebuild even if the version is unchanged."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "$LAST_VER" = "$LATEST_TAG" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build skipped notice
        if: steps.compare.outputs.should_build == 'false'
        run: echo "🚫 No build performed because there's no new version."

      - name: Free up disk space
        if: steps.compare.outputs.should_build == 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Show available disk space
        if: steps.compare.outputs.should_build == 'true'
        run: df -h

      - name: Install dependencies
        if: steps.compare.outputs.should_build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev rsync unzip \
            zlib1g-dev file wget python3-pyelftools \
            ccache ash

      - name: Clone OpenWrt source
        if: steps.compare.outputs.should_build == 'true'
        env:
          TAG: ${{ steps.get_latest_tag.outputs.latest_tag }}
        run: |
          echo "Cloning branch/tag: $TAG"
          git clone --depth=1 --branch "$TAG" \
            https://github.com/openwrt/openwrt.git openwrt

      - name: Load custom Feeds (check_feeds.sh)
        if: steps.compare.outputs.should_build == 'true'
        run: |
          bash scripts/check_feeds.sh

      - name: Load External Packages (ext_packages.sh)
        if: steps.compare.outputs.should_build == 'true'
        working-directory: ./openwrt
        run: |
          bash ../scripts/ext_packages.sh

      - name: Apply Custom Configuration (customize.sh & .config)
        if: steps.compare.outputs.should_build == 'true'
        working-directory: ./openwrt
        run: |
          for file in \
            ../config/.config \
            ../config/customize.sh \
            ../config/27_temperature.js \
            ../config/luci.temp-status
          do
            if [ ! -s "$file" ]; then
              echo "❌ Missing or empty file: $file"
              exit 1
            fi
          done

          cp ../config/.config .config
          bash ../config/customize.sh

          while IFS= read -r package; do
            [ -n "$package" ] || continue
            option="CONFIG_PACKAGE_$package"
            sed -i -e "/^${option}=/d" -e "/^# ${option} is not set$/d" .config
            printf '%s=y\n' "$option" >> .config
          done < .external-package-options

      - name: Make defconfig and download sources
        if: steps.compare.outputs.should_build == 'true'
        working-directory: ./openwrt
        run: |
          make defconfig
          make download -j8

      - name: Build OpenWrt x86_64
        if: steps.compare.outputs.should_build == 'true'
        working-directory: ./openwrt
        run: |
          echo "$(nproc) thread compile"

          export GITHUB_ACTIONS=false
          export CARGO_BUILD_JOBS=2

          make -j"$(nproc)" || {
            echo "⚠️ Parallel build failed; retrying single-threaded with detailed logs"
            make -j1 V=s
          }

      - name: Get build time
        if: steps.compare.outputs.should_build == 'true'
        id: buildtime
        run: |
          echo "time=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload firmware
        if: steps.compare.outputs.should_build == 'true'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.IGH_TOKEN }}
          tag: ${{ steps.get_latest_tag.outputs.latest_tag }}
          commit: ${{ github.sha }}
          name: OpenWrt x86_64 ${{ steps.get_latest_tag.outputs.latest_tag }}
          body: |
            🎉 OpenWrt x86_64 ${{ steps.get_latest_tag.outputs.latest_tag }}
            📅 构建时间：${{ steps.buildtime.outputs.time }}（Asia/Taipei）
            🔗 上游源码：https://github.com/openwrt/openwrt/tree/${{ steps.get_latest_tag.outputs.latest_tag }}
          artifacts: openwrt/bin/targets/x86/64/*.img.gz
          makeLatest: true
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true

      - name: Save latest built version to file
        if: steps.compare.outputs.should_build == 'true'
        env:
          LATEST_TAG: ${{ steps.get_latest_tag.outputs.latest_tag }}
        run: |
          printf '%s\n' "$LATEST_TAG" > last_build_version.txt

      - name: Save last built version cache
        if: steps.compare.outputs.should_build == 'true'
        uses: actions/cache/save@v4
        with:
          path: last_build_version.txt
          key: last-build-version-${{ github.run_id }}-${{ github.run_attempt }}
